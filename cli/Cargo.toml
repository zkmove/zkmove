[package]
name = "zkmove-cli"
version = "0.5.0"
edition = "2021"

[dependencies]
vm-circuit = { path = "../vm-circuit" }
witness = { path = "../witness" }
halo2 = { path = "../third-party/halo2" }
halo2_proofs.workspace = true
poseidon-base = { workspace = true }
move-package = { workspace = true }
move-core-types = { workspace = true }
move-binary-format = { workspace = true }
move-compiler = { workspace = true }
move-vm-runtime = { workspace = true, features = ["footprint"] }
move-stdlib = { workspace = true }
move-vm-test-utils = { workspace = true }
log.workspace = true
env_logger.workspace = true
halo2-verifier = { git = "https://github.com/zkmove/halo2-verifier.move", branch = "main", optional = true }
aptos-verifier-api = { git = "https://github.com/zkmove/halo2-verifier.move", branch = "main", optional = true }
sui-verifier-api = { git = "https://github.com/zkmove/halo2-verifier.move", branch = "main", optional = true }

anyhow = "1.0.38"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde_json = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
toml = { version = "0.8" }
rand = { version = "0.8" }

[features]
default = ["verifier"]
# On-chain transaction builders (Aptos/Sui) and their Move verifier clients.
# `vm` commands (compile/run/run-all/setup/prove/verify) do not need them, so
# witness generation can build with `--no-default-features`.
verifier = ["dep:halo2-verifier", "dep:aptos-verifier-api", "dep:sui-verifier-api"]

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "zkmove"
path = "src/main.rs"
